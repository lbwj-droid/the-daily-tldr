name: Issue

on:
  schedule:
    # Monday and Friday. 01:37 UTC = 05:37 Dubai; the issue is built early and shown to readers from 07:30.
    - cron: "37 1 * * 1,5"
    # Backup start an hour later, in case GitHub skips the first one. It stops at once if the issue already exists.
    - cron: "37 2 * * 1,5"
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date (YYYY-MM-DD, Dubai). Leave blank for today."
        required: false
        default: ""
      if_missing:
        description: "Only build if this issue does not exist yet (used by the Vercel trigger)."
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: issue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Starts: Vercel Cron at about 05:00-06:00 Dubai (api/cron-issue.js), plus GitHub's own schedule as a backup.
      # Every automatic start stops at once if the issue already exists; a manual "Run workflow" always rebuilds.
      - name: Skip if this issue already exists (automatic starts only)
        id: check
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          EVENT: ${{ github.event_name }}
          IF_MISSING: ${{ github.event.inputs.if_missing }}
        run: |
          DATE="$INPUT_DATE"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Dubai date +%F)
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "Date must be YYYY-MM-DD"; exit 1; fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "schedule" ] || [ "$IF_MISSING" = "true" ]; then
            DAY=$(TZ=Asia/Dubai date +%a)
            if [ "$DAY" != "Mon" ] && [ "$DAY" != "Fri" ]; then
              echo "Started late, on $DAY in Dubai: not an issue day; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            elif [ -f "public/data/editions/$DATE.json" ]; then
              echo "Issue $DATE already published; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - run: npm ci
        if: steps.check.outputs.skip != 'true'

      # Fails (and GitHub emails the owner) if no issue could be built. The site then keeps the previous issue.
      - name: Build the issue
        if: steps.check.outputs.skip != 'true'
        run: node scripts/build-edition.mjs
        env:
          EDITION_DATE: ${{ steps.check.outputs.date }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}

      - name: Publish (commit the issue; Vercel redeploys on push)
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "daily-tldr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data reports config/youtube-ids.json config/site-seen.json
          if git diff --cached --quiet; then echo "Nothing to publish"; exit 0; fi
          git commit -m "Issue ${{ steps.check.outputs.date }}"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep $((i * 5)); done
          exit 1

      # Published, but something needs a look (feeds down, Sheet unreachable, a thin section): fail so GitHub emails.
      - name: Check run report for warnings
        if: steps.check.outputs.skip != 'true'
        run: |
          node -e '
            const r = require("./reports/last-run.json");
            for (const w of r.warnings) console.log("::warning::" + w);
            if (r.warnings.length) process.exit(1);
          '
