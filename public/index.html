<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Daily TL;DR</title>
  <meta name="description" content="What happened today, in India and the world. One page, one minute.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TL;DR">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="masthead">
    <h1 class="brand"><a href="/" id="home">THE DAILY TL;DR</a></h1>
    <p class="dateline" id="dateline"></p>
    <nav class="days" id="days" aria-label="Past editions"></nav>
  </header>

  <main id="page" aria-live="polite">
    <p class="status" id="status">Loading today's page&hellip;</p>
  </main>

  <footer class="foot">
    <p id="helpline" class="helpline" hidden></p>
    <p id="footnote"></p>
    <p class="hint" id="install-hint" hidden>On iPhone: tap Share, then <b>Add to Home Screen</b>.</p>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
